/* ============================================================
   VIEW: SEATING
   ============================================================ */
const Seating = {
  tables:[], guests:[], assignments:[], unseated:[],
  async render(){
    document.getElementById('topbarActions').innerHTML=`<button class="btn btn-ghost" onclick="Seating.toggleView()">${this.view==='list'?'Sơ đồ':'Danh sách'}</button><button class="btn btn-primary" onclick="Seating.openAddTable()">${I.plus.replace('<svg','<svg style="width:15px;height:15px"')} Thêm bàn</button>`;
    const c=document.getElementById('content');
    c.innerHTML=`<div class="loading-center"><div class="spin"></div>Đang tải...</div>`;
    await this.load();
  },
  view:'grid',
  async load(){
    try{
      const [t,g,a]=await Promise.all([ DB.list('wed_tables',{order:['display_order']}), DB.list('wed_guests',{order:['full_name']}), DB.list('wed_seating_assignments') ]);
      this.tables=t; this.guests=g; this.assignments=a;
      this.computeUnseated();
      this.renderView();
    }catch(e){
      document.getElementById('content').innerHTML=UI.empty(I.seating,'Không tải được',e.message,'<button class="btn btn-ghost" onclick="Seating.load()">Thử lại</button>');
    }
  },
  computeUnseated(){
    const seatedIds=new Set(this.assignments.map(a=>a.guest_id));
    this.unseated=this.guests.filter(g=>!seatedIds.has(g.id) && (g.rsvp_status!=='declined'));
  },
  renderView(){
    if(this.view==='list') this.renderList(); else this.renderGrid();
  },
  toggleView(){ this.view=this.view==='grid'?'list':'grid'; this.render(); },
  renderGrid(){
    const guestMap={}; this.guests.forEach(g=>guestMap[g.id]=g);
    let html='<div class="section-h">Khách chưa xếp bàn <span class="sub">'+this.unseated.length+' người</span></div>';
    html+='<div class="unseated-list mb-24" id="unseatedDrop" ondrop="Seating.dropUnseated(event)" ondragover="Seating.dragOver(event)" ondragleave="Seating.dragLeave(event)">';
    if(!this.unseated.length) html+='<div class="text-xs muted" style="padding:8px;text-align:center">Tất cả khách đã có bàn</div>';
    this.unseated.forEach(g=>{
      html+=`<div class="unseated-chip" draggable="true" ondragstart="Seating.dragStart(event,'${g.id}')" onclick="Seating.openAssign('${g.id}')">${Util.esc(g.full_name)} <span class="muted">${g.side==='groom'?'T':'G'}</span></div>`;
    });
    html+='</div>';
    html+='<div class="section-h">Sơ đồ bàn tiệc <span class="sub">'+this.tables.length+' bàn</span></div>';
    html+='<div class="seating-grid">';
    this.tables.forEach(t=>{
      const tAssign=this.assignments.filter(a=>a.table_id===t.id);
      const used=tAssign.reduce((s,a)=>s+(a.seat_count||1),0);
      const full=used>=t.capacity;
      html+=`<div class="table-card ${full?'full':''}" id="table-${t.id}" ondrop="Seating.dropOnTable(event,'${t.id}')" ondragover="Seating.dragOver(event)" ondragleave="Seating.dragLeave(event)">
        <div class="table-head">
          <div>
            <div class="table-name">${Util.esc(t.name)}</div>
            <div class="table-cap ${full?'':''}" style="color:${full?'var(--danger)':'var(--muted)'}">${used}/${t.capacity} chỗ${full?' · Đầy':''}</div>
          </div>
          <div style="display:flex;gap:4px">
            <button class="btn-close" onclick="Seating.openEditTable('${t.id}')">${I.edit.replace('<svg','<svg style="width:14px;height:14px"')}</button>
            <button class="btn-close" onclick="Seating.confirmDeleteTable('${t.id}')">${I.trash.replace('<svg','<svg style="width:14px;height:14px"')}</button>
          </div>
        </div>
        <div class="table-seats">`;
      tAssign.forEach(a=>{
        const g=guestMap[a.guest_id];
        if(!g) return;
        html+=`<div class="seat-chip" draggable="true" ondragstart="Seating.dragStart(event,'${g.id}')" onclick="Seating.openMove('${a.id}','${g.id}')">
          <span>${Util.esc(g.full_name)} <span class="muted text-xs">${g.side==='groom'?'T':'G'}</span></span>
          <span class="remove" onclick="event.stopPropagation();Seating.unassign('${a.id}')">✕</span>
        </div>`;
      });
      if(!tAssign.length) html+='<div class="text-xs muted" style="padding:8px;text-align:center">Kéo khách vào đây</div>';
      html+=`</div></div>`;
    });
    html+='</div>';
    document.getElementById('content').innerHTML=html;
  },
  renderList(){
    const guestMap={}; this.guests.forEach(g=>guestMap[g.id]=g);
    let rows=this.tables.map(t=>{
      const tAssign=this.assignments.filter(a=>a.table_id===t.id);
      const used=tAssign.reduce((s,a)=>s+(a.seat_count||1),0);
      const groomN=tAssign.filter(a=>{const g=guestMap[a.guest_id];return g&&g.side==='groom';}).length;
      const brideN=tAssign.length-groomN;
      return `<tr><td><div style="font-weight:500">${Util.esc(t.name)}</div></td><td>${used}/${t.capacity}</td><td><span class="pill pill-side-groom">${groomN} trai</span> <span class="pill pill-side-bride">${brideN} gái</span></td><td>${tAssign.map(a=>{const g=guestMap[a.guest_id];return g?Util.esc(g.full_name):''}).join(', ')||'<span class="muted">—</span>'}</td>
      <td class="right"><button class="btn-close" onclick="Seating.openEditTable('${t.id}')">${I.edit.replace('<svg','<svg style="width:15px;height:15px"')}</button></td></tr>`;
    }).join('');
    document.getElementById('content').innerHTML=`<div class="tbl-wrap"><div class="tbl-scroll"><table class="tbl"><thead><tr><th>Bàn</th><th>Chỗ</th><th>Phân bên</th><th>Khách</th><th class="right"></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  },
  dragStart(e,guestId){ e.dataTransfer.setData('text/plain', guestId); e.target.classList.add('dragging'); },
  dragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drag-over'); },
  dragLeave(e){ e.currentTarget.classList.remove('drag-over'); },
  async dropOnTable(e,tableId){
    e.preventDefault(); e.currentTarget.classList.remove('drag-over');
    const guestId=e.dataTransfer.getData('text/plain');
    document.querySelectorAll('.dragging').forEach(el=>el.classList.remove('dragging'));
    await this.assign(guestId, tableId);
  },
  async dropUnseated(e){
    e.preventDefault(); e.currentTarget.classList.remove('drag-over');
    const guestId=e.dataTransfer.getData('text/plain');
    const a=this.assignments.find(x=>x.guest_id===guestId);
    if(a){ await this.unassign(a.id); }
  },
  async assign(guestId, tableId){
    const t=this.tables.find(x=>x.id===tableId);
    const used=this.assignments.filter(a=>a.table_id===tableId).reduce((s,a)=>s+(a.seat_count||1),0);
    if(used>=t.capacity){ Toast.err('Bàn đã đầy ('+t.capacity+' chỗ)'); return; }
    if(this.assignments.some(a=>a.guest_id===guestId)){ Toast.warn('Khách đã được xếp bàn. Di chuyển trước.'); return; }
    try{
      await DB.insert('wed_seating_assignments',{guest_id:guestId, table_id:tableId, seat_count:1});
      Toast.ok('Đã xếp bàn');
      await this.load();
    }catch(e){ Toast.err('Xếp bàn thất bại: '+(e.message||'')); }
  },
  async unassign(assignmentId){
    try{ await DB.remove('wed_seating_assignments', assignmentId); Toast.ok('Đã rút khỏi bàn'); await this.load(); }
    catch(e){ Toast.err('Thất bại: '+(e.message||'')); }
  },
  openAssign(guestId){
    const g=this.guests.find(x=>x.id===guestId);
    const opts=this.tables.map(t=>{const used=this.assignments.filter(a=>a.table_id===t.id).reduce((s,a)=>s+(a.seat_count||1),0);return `<option value="${t.id}" ${used>=t.capacity?'disabled':''}>${Util.esc(t.name)} (${used}/${t.capacity})${used>=t.capacity?' - Đầy':''}</option>`;}).join('');
    UI.confirm('Xếp bàn cho '+g.full_name, `<div class="field"><label class="label">Chọn bàn</label><select class="select" id="assignTable">${opts}</select></div>`, async ()=>{
      const tid=document.getElementById('assignTable').value;
      if(tid) await this.assign(guestId, tid);
    }, 'Xếp bàn');
  },
  openMove(assignmentId, guestId){
    const g=this.guests.find(x=>x.id===guestId);
    const opts=this.tables.map(t=>{const used=this.assignments.filter(a=>a.table_id===t.id&&a.guest_id!==guestId).reduce((s,a)=>s+(a.seat_count||1),0);return `<option value="${t.id}">${Util.esc(t.name)} (${used}/${t.capacity})</option>`;}).join('');
    UI.confirm('Di chuyển '+g.full_name, `<div class="field"><label class="label">Chuyển sang bàn</label><select class="select" id="moveTable">${opts}</select></div>
      <div style="margin-top:12px"><button class="btn btn-danger btn-sm" onclick="Seating.unassign('${assignmentId}');UI.closeModal();">Rút khỏi bàn</button></div>`, async ()=>{
      const tid=document.getElementById('moveTable').value;
      if(tid){ await this.unassign(assignmentId); await this.assign(guestId, tid); }
    }, 'Di chuyển');
  },
  openAddTable(){ this.openTableDrawer(null); },
  openEditTable(id){ this.openTableDrawer(this.tables.find(t=>t.id===id)); },
  openTableDrawer(t){
    const isEdit=!!t;
    const body=`<div class="field"><label class="label">Tên bàn *</label><input class="input" id="tName" value="${t?Util.esc(t.name):''}" placeholder="Bàn 1"/></div>

      <div class="field"><label class="label">Mô tả</label><input class="input" id="bDesc" value="${i?Util.esc(i.description||''):''}"/></div>
      <div class="row-3"><div class="field"><label class="label">Dự kiến (₫)</label><input class="input" type="number" id="bEst" value="${i?i.estimated_amount||0:0}"/></div><div class="field"><label class="label">Thực tế (₫)</label><input class="input" type="number" id="bAct" value="${i?i.actual_amount||0:0}"/></div><div class="field"><label class="label">Đã trả (₫)</label><input class="input" type="number" id="bPaid" value="${i?i.paid_amount||0:0}"/></div></div>
      <div class="row"><div class="field"><label class="label">Hạn thanh toán</label><input class="input" type="date" id="bDue" value="${i?i.due_date||'':''}"/></div><div class="field"><label class="label">Trạng thái</label><select class="select" id="bStatus"><option value="planned" ${!i||i.status==='planned'?'selected':''}>Dự kiến</option><option value="booked" ${i&&i.status==='booked'?'selected':''}>Đã đặt</option><option value="paid" ${i&&i.status==='paid'?'selected':''}>Đã trả</option><option value="cancelled" ${i&&i.status==='cancelled'?'selected':''}>Đã hủy</option></select></div></div>
      <div class="field"><label class="label">Ghi chú</label><textarea class="textarea" id="bNotes">${i?Util.esc(i.notes||''):''}</textarea></div>`;
    const foot=`<button class="btn btn-ghost" onclick="UI.closeDrawer()">Hủy</button><button class="btn btn-primary" onclick="Budget.save('${i?i.id:''}')">${isEdit?'Lưu':'Thêm'}</button>`;
    UI.openDrawer(isEdit?'Sửa khoản chi':'Thêm khoản chi', body, foot);
  },
  async save(id){
    const row={ category:document.getElementById('bCat').value.trim(), description:document.getElementById('bDesc').value.trim()||null, vendor:document.getElementById('bVendor').value.trim()||null, estimated_amount:parseFloat(document.getElementById('bEst').value)||0, actual_amount:parseFloat(document.getElementById('bAct').value)||0, paid_amount:parseFloat(document.getElementById('bPaid').value)||0, due_date:document.getElementById('bDue').value||null, status:document.getElementById('bStatus').value, notes:document.getElementById('bNotes').value.trim()||null };
    if(!row.category){ Toast.err('Nhập danh mục'); return; }
    try{ if(id) await DB.update('wed_budget_items',id,row); else await DB.insert('wed_budget_items',row); Toast.ok('Đã lưu'); UI.closeDrawer(); await this.render(); }
    catch(e){ Toast.err('Lưu thất bại: '+(e.message||'')); }
  },
  confirmDelete(id){ UI.confirm('Xóa khoản chi?','',()=>this.doDelete(id),'Xóa',true); },
  async doDelete(id){ try{ await DB.remove('wed_budget_items',id); Toast.ok('Đã xóa'); await this.render(); }catch(e){ Toast.err('Xóa thất bại: '+(e.message||'')); } },
  openAddGift(){
    const guests=this.guests||[];
    const body=`<div class="field"><label class="label">Người tặng</label><input class="input" id="gGiver" placeholder="Tên khách"/></div>
      <div class="row"><div class="field"><label class="label">Số tiền (₫)</label><input class="input" type="number" id="gAmount" value="0"/></div><div class="field"><label class="label">Ngày nhận</label><input class="input" type="date" id="gDate" value="${new Date().toISOString().slice(0,10)}"/></div></div>
      <div class="field"><label class="label">Mô tả quà</label><input class="input" id="gDesc" placeholder="Phong bì / quà vật chất..."/></div>
      <div class="field"><label class="label">Đã cảm ơn?</label><select class="select" id="gThank"><option value="false">Chưa</option><option value="true">Rồi</option></select></div>`;
    const foot=`<button class="btn btn-ghost" onclick="UI.closeDrawer()">Hủy</button><button class="btn btn-primary" onclick="Budget.saveGift()">Lưu</button>`;
    UI.openDrawer('Thêm quà mừng', body, foot);
  },
  async saveGift(){
    const row={ giver_name:document.getElementById('gGiver').value.trim()||null, amount:parseFloat(document.getElementById('gAmount').value)||0, received_date:document.getElementById('gDate').value||null, gift_description:document.getElementById('gDesc').value.trim()||null, thank_you_sent:document.getElementById('gThank').value==='true' };
    try{ await DB.insert('wed_gifts',row); Toast.ok('Đã lưu quà mừng'); UI.closeDrawer(); await this.render(); }
    catch(e){ Toast.err('Lưu thất bại: '+(e.message||'')); }
  }
};

/* ============================================================
   VIEW: SETTINGS
   ============================================================ */
const Settings = {
  async render(){
    const c=document.getElementById('content');
    c.innerHTML=`<div class="loading-center"><div class="spin"></div>Đang tải...</div>`;
    try{
      const settings=await DB.list('wed_wedding_settings').catch(()=>[]);
      const allowed=await DB.list('wed_allowed_users').catch(()=>[]);
      const s=settings[0]||{};
      let html='<div class="section-h">Thông tin đám cưới</div>';
      html+=`<div class="card" style="padding:24px;margin-bottom:24px">
        <div class="row"><div class="field"><label class="label">Tên chú rể</label><input class="input" id="sGroom" value="${Util.esc(s.groom_name||'')}"/></div><div class="field"><label class="label">Tên cô dâu</label><input class="input" id="sBride" value="${Util.esc(s.bride_name||'')}"/></div></div>
        <div class="row"><div class="field"><label class="label">Ngày cưới</label><input class="input" type="date" id="sDate" value="${s.wedding_date||''}"/></div><div class="field"><label class="label">Địa điểm</label><input class="input" id="sVenue" value="${Util.esc(s.venue||'')}"/></div></div>
        <div class="row"><div class="field"><label class="label">Nhãn nhà trai</label><input class="input" id="sGroomLabel" value="${Util.esc(s.groom_side_label||'Nhà trai')}"/></div><div class="field"><label class="label">Nhãn nhà gái</label><input class="input" id="sBrideLabel" value="${Util.esc(s.bride_side_label||'Nhà gái')}"/></div></div>
        <div class="field"><label class="label">Ghi chú</label><textarea class="textarea" id="sNotes">${Util.esc(s.notes||'')}</textarea></div>
        <button class="btn btn-primary" onclick="Settings.saveSettings('${s.id||''}')">Lưu cấu hình</button>
      </div>`;
      html+='<div class="section-h">Tài khoản được phép</div>';
      html+=`<div class="card" style="padding:8px 16px;margin-bottom:24px">
        <div class="text-sm muted mb-16">Chỉ hai tài khoản sau có thể truy cập. Quản lý qua Supabase Dashboard.</div>
        ${allowed.map(a=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)"><div class="user-avatar">${Util.initials(a.email)}</div><div><div style="font-size:13px;font-weight:500">${Util.esc(a.email)}</div><div class="text-xs muted">${a.note||'—'}</div></div></div>`).join('')}
      </div>`;
      html+='<div class="section-h">Bảo mật</div>';
      html+=`<div class="card" style="padding:16px 20px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span class="pill pill-confirmed">RLS bật</span><span class="text-sm muted">Mọi bảng wed_* có Row Level Security</span></div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span class="pill pill-confirmed">Allowlist</span><span class="text-sm muted">Kiểm tra cả frontend lẫn database</span></div>
        <div style="display:flex;align-items:center;gap:10px"><span class="pill pill-confirmed">Anon key</span><span class="text-sm muted">Chỉ dùng publishable key, không service_role</span></div>
      </div>`;
      c.innerHTML=html;
    }catch(e){ c.innerHTML=UI.empty(I.settings,'Không tải được',e.message,'<button class="btn btn-ghost" onclick="Settings.render()">Thử lại</button>'); }
  },
  async saveSettings(id){
    const row={ groom_name:document.getElementById('sGroom').value.trim()||null, bride_name:document.getElementById('sBride').value.trim()||null, wedding_date:document.getElementById('sDate').value||null, venue:document.getElementById('sVenue').value.trim()||null, groom_side_label:document.getElementById('sGroomLabel').value.trim()||'Nhà trai', bride_side_label:document.getElementById('sBrideLabel').value.trim()||'Nhà gái', notes:document.getElementById('sNotes').value.trim()||null };
    try{
      if(id) await DB.update('wed_wedding_settings',id,row);
      else await DB.insert('wed_wedding_settings',row);
      Toast.ok('Đã lưu cấu hình');
    }catch(e){ Toast.err('Lưu thất bại: '+(e.message||'')); }
  }
};

/* ---------- BOOT ---------- */
window.addEventListener('DOMContentLoaded', async ()=>{
  // Đây là cửa sổ popup OAuth: chỉ chuyển token về trang gốc rồi đóng, KHÔNG chạy app
  if(window.name===POPUP_NAME && window.opener){
    const qp=new URLSearchParams(location.search.slice(1)+'&'+location.hash.replace(/^#/,''));
    const at=qp.get('access_token'), rt=qp.get('refresh_token');
    const err=qp.get('error_description')||qp.get('error');
    if(at || err){
      document.body.innerHTML='<p style="font-family:sans-serif;padding:24px;color:#555">Đăng nhập xong, đang quay lại…</p>';
      try{ window.opener.postMessage({ type:'wed-oauth', access_token:at, refresh_token:rt, error: err?err.replace(/\+/g,' '):null }, '*'); }catch(e){}
      setTimeout(()=>window.close(), 300);
      return;
    }
  }
  document.getElementById('btnGoogleLogin').addEventListener('click', ()=>Auth.signInWithGoogle());
  window.addEventListener('pageshow', ()=>{ const b=document.getElementById('btnGoogleLogin'); if(b){ b.disabled=false; document.getElementById('googleBtnText').textContent='Tiếp tục với Google'; } });
  try{
    const qp=new URLSearchParams(location.search.slice(1)+'&'+location.hash.replace(/^#/,''));
    const ed=qp.get('error_description')||qp.get('error');
    if(ed){ const el=document.getElementById('loginError'); el.textContent='Lỗi đăng nhập: '+ed.replace(/\+/g,' '); el.classList.add('show'); }
  }catch(e){}
  try{ await Auth.init(); }
  catch(e){
    const err=document.getElementById('loginError');
    err.textContent='Không khởi tạo được ứng dụng: '+(e.message||'');
    err.classList.add('show');
  }
});
</script>

<script id="wa-ux">
/* UX helpers only — no business logic. Escape to close, ARIA names, live toasts. */
(function(){
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    var m=document.getElementById('modalOverlay'), d=document.getElementById('drawer');
    try{
      if(m && m.classList.contains('show')) UI.closeModal();
      else if(d && d.classList.contains('show')) UI.closeDrawer();
    }catch(_){}
  });
  function label(){
    document.querySelectorAll('button:not([aria-label])').forEach(function(b){
      if(!b.textContent.trim()){ var t=b.getAttribute('title'); if(t) b.setAttribute('aria-label',t); else if(b.classList.contains('btn-close')) b.setAttribute('aria-label','Đóng'); }
    });
    document.querySelectorAll('.task-check:not([role])').forEach(function(c){ c.setAttribute('role','checkbox'); c.setAttribute('aria-checked',c.classList.contains('done')?'true':'false'); });
  }
  function setup(){
    var t=document.getElementById('toaster'); if(t){ t.setAttribute('role','status'); t.setAttribute('aria-live','polite'); }
    var m=document.querySelector('#modalOverlay .modal'); if(m){ m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); }
    var d=document.getElementById('drawer'); if(d){ d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); }
    label();
    var pend=false;
    new MutationObserver(function(){ if(pend) return; pend=true; requestAnimationFrame(function(){ pend=false; label(); }); }).observe(document.body,{childList:true,subtree:true});
  }
  (function(){
    var nav=document.querySelector('.mobile-nav'); if(!nav) return;
    function center(){ var a=nav.querySelector('.mn-item.active'); if(a && nav.scrollWidth>nav.clientWidth){ nav.scrollTo({left:a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2,behavior:'smooth'}); } }
    new MutationObserver(center).observe(nav,{subtree:true,attributes:true,attributeFilter:['class'],childList:true});
  })();
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup); else setup();
})();
</script>
