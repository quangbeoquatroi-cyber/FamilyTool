<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Wedding Atelier — Private Wedding Planner</title>
<meta name="description" content="Private wedding command center"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ivory:#FAF6F0; --ivory-2:#F3EBDF; --paper:#FFFFFF;
  --ink:#241F1C; --ink-2:#564C44; --muted:#857A6E; --muted-2:#BFB3A6;
  --line:#ECE4D7; --line-2:#DBCFBF;
  --burgundy:#6B2737; --burgundy-2:#873347; --burgundy-soft:#F4EAEC;
  --forest:#3D5A45; --forest-soft:#EBF0EA;
  --champagne:#BE9A53; --champagne-soft:#F7F0DD;
  --danger:#B5453A; --danger-soft:#F8E8E5;
  --warn:#B8862F; --warn-soft:#F9F0DC;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --shadow-sm:0 1px 2px rgba(43,37,34,.05);
  --shadow:0 1px 2px rgba(43,37,34,.04),0 6px 20px rgba(43,37,34,.07);
  --shadow-lg:0 12px 44px rgba(43,37,34,.15);
  --radius:12px; --radius-sm:8px; --radius-lg:16px;
  --ring:0 0 0 3px rgba(107,39,55,.20);
  --ease:cubic-bezier(.4,0,.2,1);
  --t-fast:.15s var(--ease); --t:.25s var(--ease); --t-slow:.35s var(--ease);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--ivory);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::selection{background:var(--burgundy-soft)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ===== LOGIN ===== */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(ellipse at 20% 10%,#F7F0E4 0%,transparent 50%),
  radial-gradient(ellipse at 80% 90%,#F3E8EA 0%,transparent 50%),
  var(--ivory);z-index:100}
.login-card{width:min(440px,92vw);padding:56px 48px 48px;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);text-align:center;position:relative}
.login-card::before{content:'';position:absolute;top:16px;left:16px;right:16px;bottom:16px;border:1px solid var(--line);border-radius:10px;pointer-events:none;opacity:.5}
.login-monogram{width:64px;height:64px;margin:0 auto 24px;border:1px solid var(--champagne);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:30px;font-style:italic;color:var(--burgundy);letter-spacing:-1px}
.login-title{font-family:var(--serif);font-size:34px;font-weight:500;letter-spacing:-.5px;color:var(--ink);line-height:1.1}
.login-sub{font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted);margin-top:8px;letter-spacing:.3px}
.login-divider{display:flex;align-items:center;gap:14px;margin:32px 0 24px;color:var(--muted-2);font-size:11px;letter-spacing:2px;text-transform:uppercase}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--line)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 20px;background:var(--paper);border:1px solid var(--line-2);border-radius:8px;font-size:14px;font-weight:500;color:var(--ink);transition:all .2s}
.btn-google:hover{border-color:var(--burgundy);box-shadow:0 2px 8px rgba(107,39,55,.08)}
.btn-google:active{transform:scale(.99)}
.btn-google svg{width:18px;height:18px}
.btn-google:disabled{opacity:.6;cursor:not-allowed}
.login-foot{margin-top:24px;font-size:12px;color:var(--muted);font-family:var(--serif);font-style:italic}
.login-error{margin-top:18px;padding:12px 16px;background:var(--danger-soft);border:1px solid #E8C9C4;border-radius:8px;font-size:13px;color:var(--danger);display:none}
.login-error.show{display:block}

/* ===== TRANSITION ===== */
#transition{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--ivory);z-index:99}
#transition.show{display:flex}
.trans-monogram{width:80px;height:80px;border:1px solid var(--champagne);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:38px;font-style:italic;color:var(--burgundy);animation:pop .6s ease}
.trans-text{margin-top:24px;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--ink-2);animation:fadeUp .8s ease .2s both}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeUp{0%{transform:translateY(8px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* ===== DENIED ===== */
#denied{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--ivory);z-index:98;padding:40px;text-align:center}
#denied.show{display:flex}
.denied-icon{width:64px;height:64px;border:1px solid var(--danger);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--danger);font-size:28px;margin-bottom:24px}
.denied-title{font-family:var(--serif);font-size:28px;color:var(--ink);margin-bottom:8px}
.denied-msg{max-width:380px;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:16px;margin-bottom:28px}

/* ===== APP SHELL ===== */
#app{display:none;height:100vh;height:100dvh}
#app.show{display:grid;grid-template-columns:248px 1fr}
.sidebar{background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:28px 0;overflow-y:auto}
.brand{padding:0 28px 28px;border-bottom:1px solid var(--line)}
.brand-mono{font-family:var(--serif);font-size:24px;font-style:italic;color:var(--burgundy);letter-spacing:-.5px}
.brand-sub{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-top:4px}
.nav{padding:20px 16px;flex:1}
.nav-section{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted-2);padding:16px 12px 8px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:all .15s;margin-bottom:2px;width:100%;text-align:left}
.nav-item:hover{background:var(--ivory-2);color:var(--ink)}
.nav-item.active{background:var(--burgundy-soft);color:var(--burgundy);font-weight:500}
.nav-item .ico{width:18px;height:18px;flex-shrink:0;opacity:.7}
.nav-item.active .ico{opacity:1}
.nav-item .badge{margin-left:auto;font-size:11px;background:var(--ivory-2);color:var(--muted);padding:2px 8px;border-radius:10px;font-weight:500}
.nav-item.active .badge{background:var(--burgundy);color:#fff}
.sidebar-foot{padding:16px 28px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.user-chip{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--burgundy-soft);color:var(--burgundy);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.user-name{font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-email{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-logout{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);transition:color .15s}
.btn-logout:hover{color:var(--danger)}

.main{overflow-y:auto;position:relative}
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,246,240,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:20px 40px;display:flex;align-items:center;justify-content:space-between}
.topbar-title{font-family:var(--serif);font-size:26px;font-weight:500;color:var(--ink);letter-spacing:-.3px}
.topbar-sub{font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--serif);font-style:italic}
.topbar-actions{display:flex;align-items:center;gap:10px}
.content{padding:32px 40px 80px;max-width:1200px}

/* ===== COMPONENTS ===== */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;border:1px solid transparent}
.btn-primary{background:var(--burgundy);color:#fff}
.btn-primary:hover{background:var(--burgundy-2)}
.btn-ghost{background:var(--paper);border-color:var(--line-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--burgundy);color:var(--burgundy)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{background:var(--paper);border-color:var(--line-2);color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.input,.select,.textarea{width:100%;padding:9px 12px;background:var(--paper);border:1px solid var(--line-2);border-radius:8px;font-size:13px;transition:border .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--burgundy)}
.textarea{resize:vertical;min-height:72px}
.label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;letter-spacing:.2px}
.field{margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}

/* Stats */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;position:relative;overflow:hidden}
.stat-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat-value{font-family:var(--serif);font-size:38px;font-weight:500;color:var(--ink);line-height:1.1;margin-top:6px;letter-spacing:-1px}
.stat-sub{font-size:12px;color:var(--muted);margin-top:4px}
.stat .accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--burgundy)}
.stat.forest .accent-bar{background:var(--forest)}
.stat.champagne .accent-bar{background:var(--champagne)}
.stat.danger .accent-bar{background:var(--danger)}
.stat.warn .accent-bar{background:var(--warn)}

/* Section heading */
.section-h{font-family:var(--serif);font-size:20px;font-weight:500;color:var(--ink);margin:0 0 16px;display:flex;align-items:center;justify-content:space-between}
.section-h .sub{font-size:12px;font-family:var(--sans);font-style:normal;color:var(--muted);font-weight:400}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 14px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.tbl tr:hover td{background:var(--ivory-2)}
.tbl-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.tbl-scroll{overflow-x:auto}

/* Badges / pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:500}
.pill-confirmed{background:var(--forest-soft);color:var(--forest)}
.pill-declined{background:var(--danger-soft);color:var(--danger)}
.pill-pending{background:var(--warn-soft);color:var(--warn)}
.pill-sent{background:var(--champagne-soft);color:#8A6F2A}
.pill-notsent{background:var(--ivory-2);color:var(--muted)}
.pill-need{background:#F0E4F0;color:#7B4A7B}
.pill-side-groom{background:#EAEAF2;color:#3A3A6B}
.pill-side-bride{background:var(--burgundy-soft);color:var(--burgundy)}
.pill-priority-high{background:var(--danger-soft);color:var(--danger)}
.pill-priority-medium{background:var(--warn-soft);color:var(--warn)}
.pill-priority-low{background:var(--ivory-2);color:var(--muted)}

/* Toolbar */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:200px;max-width:360px}
.search-box input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);font-size:13px}
.search-box input:focus{outline:none;border-color:var(--burgundy)}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.filter-select{padding:9px 12px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);font-size:13px;cursor:pointer}
.filter-select:focus{outline:none;border-color:var(--burgundy)}

/* Drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(43,37,34,.3);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,92vw);background:var(--paper);z-index:51;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:24px 28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-title{font-family:var(--serif);font-size:22px;font-weight:500}
.drawer-body{flex:1;overflow-y:auto;padding:24px 28px}
.drawer-foot{padding:18px 28px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.btn-close{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s}
.btn-close:hover{background:var(--ivory-2);color:var(--ink)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(43,37,34,.4);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{width:min(480px,94vw);max-height:86vh;overflow-y:auto;background:var(--paper);border-radius:14px;box-shadow:var(--shadow-lg);padding:28px;animation:modalIn .2s ease}
@keyframes modalIn{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
.modal-title{font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:8px}
.modal-body{color:var(--ink-2);font-size:14px;margin:16px 0 24px;line-height:1.6}
.modal-foot{display:flex;gap:10px;justify-content:flex-end}

/* Toast */
#toaster{position:fixed;bottom:24px;right:24px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:#fff;padding:13px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;animation:toastIn .3s ease;max-width:360px}
.toast.success{background:var(--forest)}
.toast.error{background:var(--danger)}
.toast.warn{background:var(--warn)}
@keyframes toastIn{0%{transform:translateX(40px);opacity:0}100%{transform:translateX(0);opacity:1}}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-icon{width:56px;height:56px;margin:0 auto 16px;border:1px solid var(--line-2);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted-2)}
.empty-title{font-family:var(--serif);font-size:20px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.empty-msg{font-size:13px;max-width:340px;margin:0 auto 20px;font-family:var(--serif);font-style:italic}

/* Loading */
.skeleton{background:linear-gradient(90deg,var(--ivory-2) 25%,var(--line) 37%,var(--ivory-2) 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.spin{width:18px;height:18px;border:2px solid var(--line-2);border-top-color:var(--burgundy);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;align-items:center;justify-content:center;gap:10px;padding:40px;color:var(--muted);font-size:13px}

/* Progress */
.progress{height:6px;background:var(--ivory-2);border-radius:6px;overflow:hidden}
.progress-bar{height:100%;background:var(--burgundy);border-radius:6px;transition:width .4s ease}
.progress-bar.forest{background:var(--forest)}
.progress-bar.champagne{background:var(--champagne)}

/* Seating */
.seating-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.table-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);transition:all .2s}
.table-card.drag-over{border-color:var(--burgundy);box-shadow:0 0 0 3px var(--burgundy-soft)}
.table-card.full{border-color:var(--danger)}
.table-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.table-name{font-family:var(--serif);font-size:18px;font-weight:600}
.table-cap{font-size:11px;color:var(--muted);font-weight:500}
.table-seats{display:flex;flex-direction:column;gap:6px;min-height:40px}
.seat-chip{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--ivory-2);border-radius:7px;font-size:12.5px;cursor:grab;transition:all .15s}
.seat-chip:hover{background:var(--burgundy-soft)}
.seat-chip.dragging{opacity:.4}
.seat-chip .remove{opacity:0;transition:opacity .15s;color:var(--muted);cursor:pointer}
.seat-chip:hover .remove{opacity:1}
.seat-chip .remove:hover{color:var(--danger)}
.unseated-list{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.unseated-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--ivory-2);border-radius:20px;font-size:12.5px;margin:4px;cursor:grab;transition:all .15s;border:1px dashed var(--line-2)}
.unseated-chip:hover{background:var(--burgundy-soft);border-color:var(--burgundy)}
.unseated-chip.dragging{opacity:.4}

/* Checklist */
.task-row{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);transition:background .15s}
.task-row:hover{background:var(--ivory-2)}
.task-check{width:20px;height:20px;border:1.5px solid var(--line-2);border-radius:50%;flex-shrink:0;margin-top:1px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.task-check.done{background:var(--forest);border-color:var(--forest);color:#fff}
.task-check.done svg{width:12px;height:12px}
.task-body{flex:1;min-width:0}
.task-title{font-size:13.5px;color:var(--ink);font-weight:500}
.task-title.done{text-decoration:line-through;color:var(--muted)}
.task-meta{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}

/* Timeline / events */
.event-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:14px;position:relative;overflow:hidden}
.event-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--champagne)}
.event-name{font-family:var(--serif);font-size:20px;font-weight:600}
.event-meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
.event-stats{display:flex;gap:24px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.event-stat{font-size:12px;color:var(--muted)}
.event-stat b{font-family:var(--serif);font-size:20px;color:var(--ink);display:block;font-weight:600}

/* Two-column */
.col2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media(max-width:900px){.col2{grid-template-columns:1fr}}

/* Mobile */
.mobile-nav{display:none}
@media(max-width:768px){
  #app.show{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);z-index:30;padding:8px;justify-content:space-around;box-shadow:0 -2px 12px rgba(0,0,0,.04)}
  .mobile-nav .mn-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 8px;font-size:10px;color:var(--muted);border-radius:8px}

/* Long Vietnamese names / emails never overflow */
.tbl td,.task-title,.event-name,.event-meta,.seat-chip,.unseated-chip,.table-name,.card{ overflow-wrap:anywhere; }
.user-name,.user-email{ max-width:100%; }

/* Navigation clarity */
.nav-item{ position:relative; }
.nav-item.active::before{ content:''; position:absolute; left:-16px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--burgundy); }
.nav-section{ color:var(--muted); }
.login-divider{ color:var(--muted); }
.stat-label,.tbl th{ color:var(--muted); }

/* Interaction states */
.btn,.nav-item,.mn-item,.btn-close,.task-check{ -webkit-tap-highlight-color:transparent; }
.btn:active:not(:disabled){ transform:scale(.98); }
.btn-primary:hover{ box-shadow:0 4px 14px rgba(107,39,55,.22); }
.btn:disabled,.btn-google:disabled{ opacity:.55; filter:saturate(.7); }
.input:focus,.select:focus,.textarea:focus,.search-box input:focus,.filter-select:focus{ border-color:var(--burgundy); box-shadow:var(--ring); outline:none; }
.input::placeholder,.textarea::placeholder,.search-box input::placeholder{ color:var(--muted-2); }

/* Overlays: soft fade, no layout shift */
.modal-overlay{ animation:fadeIn .2s ease; }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
.drawer{ height:100vh; height:100dvh; }
.drawer-body{ overscroll-behavior:contain; }
.modal{ overscroll-behavior:contain; max-height:min(86vh,86dvh); }

/* Toast: leave exit smoothly, above mobile nav, safe-area aware */
#toaster{ bottom:calc(24px + env(safe-area-inset-bottom)); right:max(24px,env(safe-area-inset-right)); }
.toast{ line-height:1.4; }
.toast.success::before{ content:'✓'; font-weight:700; } .toast.error::before{ content:'!'; font-weight:700; }

/* Tables: deliberate horizontal scroll with sticky first column */
.tbl-scroll{ -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; }
@media (max-width:820px){
  .tbl-scroll .tbl{ min-width:640px; }
  .tbl-scroll .tbl td:first-child,.tbl-scroll .tbl th:first-child{ position:sticky; left:0; z-index:1; background:var(--paper); box-shadow:1px 0 0 var(--line); }
  .tbl-scroll .tbl tr:hover td:first-child{ background:var(--ivory-2); }
}

@media (max-width:768px){
  /* 16px inputs stop iOS Safari from zooming on focus */
  .input,.select,.textarea,.search-box input,.filter-select{ font-size:16px; }
  #toaster{ left:14px; right:14px; bottom:calc(84px + env(safe-area-inset-bottom)); align-items:stretch; }
  .toast{ max-width:none; }
  .drawer-foot{ padding-bottom:calc(16px + env(safe-area-inset-bottom)); background:var(--paper); }
  .drawer-foot .btn{ flex:1; justify-content:center; }
  .modal-foot .btn{ flex:1; justify-content:center; }
  .topbar-actions{ max-width:60%; }
}
@media (pointer:coarse){
  .btn,.filter-select,.input,.select{ min-height:44px; }
  .btn-sm{ min-height:40px; }
  .mobile-nav .mn-item{ min-height:48px; }
}
@media (prefers-reduced-motion:reduce){
  .modal-overlay,.drawer,.toast,.skeleton{ animation:none!important; transition:none!important; }
}

/* ---- Fix: icons injected without .ico class rendered at intrinsic size ---- */
.search-box > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
:where(svg:not([width]):not([height])){width:1.15em;height:1.15em}
/* ---- Fix: stacked row actions + closed-drawer shadow bleeding onto page edge ---- */
.tbl td .btn-close{display:inline-flex;vertical-align:middle}
.tbl td.right{white-space:nowrap}
.drawer:not(.show){box-shadow:none;visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s}
.drawer.show{visibility:visible;transition:transform .3s var(--ease)}

/* ---- v4: mobile nav scrolls (9 routes), topbar, filters, money wrapping, stat grid ---- */
.tbl td{ overflow-wrap:break-word; }                      /* was 'anywhere': split money mid-digit */
.stat-grid:has(> .stat:nth-child(6):last-child){ grid-template-columns:repeat(3,1fr); }
@media (max-width:820px){
  .stat-grid:has(> .stat:nth-child(6):last-child){ grid-template-columns:repeat(2,1fr); }
}
@media (max-width:768px){
  .mobile-nav{ justify-content:flex-start; gap:2px; scroll-snap-type:x proximity; }
  .mobile-nav .mn-item{ flex:0 0 auto; min-width:76px; padding:7px 8px; scroll-snap-align:center; }
  .mobile-nav .mn-item span{ overflow:visible; max-width:none; font-size:10px; }
  .topbar{ flex-wrap:wrap; gap:10px 12px; }
  .topbar > div:first-child{ min-width:0; flex:1 1 auto; }
  .topbar-actions{ max-width:none; flex:1 1 100%; justify-content:stretch; }
  .topbar-actions .btn{ flex:1 1 auto; justify-content:center; white-space:nowrap; }
  .topbar-actions .btn:only-child{ flex:0 0 auto; margin-left:auto; }
  .toolbar .filter-select{ flex:1 1 calc(50% - 6px); min-width:0; text-overflow:ellipsis; }
}

<script>
/* ============================================================
   THE WEDDING ATELIER — Single-file Wedding Command Center
   Modules: Config · Auth · DB · UI · Router · Views
   ============================================================ */

/* ---------- CONFIG ---------- */
const CONFIG = {
  SUPABASE_URL: "https://acwlagoieszpydklikqw.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjd2xhZ29pZXN6cHlka2xpa3F3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1ODc5MDYsImV4cCI6MjA5MzE2MzkwNn0.I50smOD2_phj8PSSg4A0KzepYliWQinGXVmZpop9ljI",
  ALLOWED_EMAILS: ["quangphamit2018@gmail.com","quynhanhphameng@gmail.com"]
};

/* ---------- SUPABASE CLIENT ---------- */
/* localStorage có thể bị chặn trong iframe/sandbox -> fallback bộ nhớ tạm */
function safeStorage(){
  try{ const k='__wed_t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return localStorage; }
  catch(e){ const m={}; return { getItem:k=>(k in m?m[k]:null), setItem:(k,v)=>{m[k]=String(v)}, removeItem:k=>{delete m[k]} }; }
}
const POPUP_NAME='wed_oauth_popup';
let sb = null;
function initSupabase(){
  if(sb) return sb;
  if(!window.supabase || !window.supabase.createClient){
    throw new Error("Không tải được thư viện Supabase. Kiểm tra kết nối mạng.");
  }
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit', storage: safeStorage() }
  });
  return sb;
}

/* ---------- UTIL ---------- */
const Util = {
  esc(s){ if(s==null) return ""; return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  fmtDate(d){ if(!d) return "—"; const dt = typeof d==='string'?new Date(d+'T00:00:00'):new Date(d); if(isNaN(dt)) return "—"; return dt.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}); },
  fmtDateLong(d){ if(!d) return "—"; const dt = typeof d==='string'?new Date(d+'T00:00:00'):new Date(d); if(isNaN(dt)) return "—"; return dt.toLocaleDateString('vi-VN',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); },
  fmtMoney(n){ return (Number(n)||0).toLocaleString('vi-VN')+' ₫'; },
  debounce(fn,ms=300){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; },
  daysUntil(d){ if(!d) return null; const dt=new Date(d+'T00:00:00'); const now=new Date(); now.setHours(0,0,0,0); return Math.ceil((dt-now)/86400000); },
  uid(){ return 'id'+Math.random().toString(36).slice(2,10); },
  initials(name){ if(!name) return '?'; const p=name.trim().split(/\s+/); return (p.length>1?p[0][0]+p[p.length-1][0]:p[0].slice(0,2)).toUpperCase(); },
  csvEscape(v){ v=v==null?'':String(v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; },
  parseCSV(text){
    const rows=[]; let row=[]; let cell=''; let inQ=false;
    text = text.replace(/^\uFEFF/,'');
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(inQ){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; } else cell+=c; }
      else { if(c==='"') inQ=true; else if(c===','){ row.push(cell); cell=''; } else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else if(c!=='\r') cell+=c; }
    }
    if(cell!==''||row.length){ row.push(cell); rows.push(row); }
    return rows.filter(r=>r.some(c=>c.trim()!==''));
  }
};

/* ---------- TOAST ---------- */
const Toast = {
  show(msg, type='info', ms=3000){
    const el=document.createElement('div');
    el.className='toast '+type;
    el.textContent=msg;
    document.getElementById('toaster').appendChild(el);
    setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(40px)'; el.style.transition='all .3s'; setTimeout(()=>el.remove(),300); }, ms);
  },
  ok(m){ this.show(m,'success'); },
  err(m){ this.show(m,'error',4000); },
  warn(m){ this.show(m,'warn',3500); }
};

/* ---------- UI HELPERS ---------- */
const UI = {
  drawerOpen:false,
  openDrawer(title, bodyHTML, footHTML){
    document.getElementById('drawerTitle').textContent=title;
    document.getElementById('drawerBody').innerHTML=bodyHTML;
    document.getElementById('drawerFoot').innerHTML=footHTML||'';
    document.getElementById('drawer').classList.add('show');
    document.getElementById('drawerOverlay').classList.add('show');
    this.drawerOpen=true;
  },
  closeDrawer(){
    document.getElementById('drawer').classList.remove('show');
    document.getElementById('drawerOverlay').classList.remove('show');
    this.drawerOpen=false;
  },
  modal(innerHTML){
    document.getElementById('modal').innerHTML=innerHTML;
    document.getElementById('modalOverlay').classList.add('show');
  },
  confirm(title, body, onYes, yesLabel='Xác nhận', danger=false){
    this.modal(`<div class="modal-title">${Util.esc(title)}</div><div class="modal-body">${body}</div>
      <div class="modal-foot">
        <button class="btn btn-ghost" onclick="UI.closeModal()">Hủy</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" id="modalYes">${Util.esc(yesLabel)}</button>
      </div>`);
    document.getElementById('modalYes').onclick=()=>{ onYes(); this.closeModal(); };
  },
  closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); },
  skeleton(rows=5){
    let h='<div style="padding:8px">';
    for(let i=0;i<rows;i++) h+=`<div class="skeleton" style="height:42px;margin-bottom:10px"></div>`;
    return h+'</div>';
  },
  empty(icon, title, msg, btn){
    return `<div class="empty"><div class="empty-icon">${icon||''}</div><div class="empty-title">${title}</div><div class="empty-msg">${msg}</div>${btn||''}</div>`;
  }
};
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') UI.closeModal(); });

/* ---------- DB ---------- */
const DB = {
  async list(table, opts={}){
    let q = sb.from(table).select(opts.select||'*');
    if(opts.eq) for(const k in opts.eq) q=q.eq(k, opts.eq[k]);
    if(opts.order) q=q.order(opts.order[0],{ascending:opts.order[1]!==false});
    if(opts.limit) q=q.limit(opts.limit);
    const {data,error} = await q;
    if(error) throw error;
    return data||[];
  },
  async insert(table, row){ const {data,error}=await sb.from(table).insert(row).select().single(); if(error) throw error; return data; },
  async update(table, id, patch){
    let {data,error}=await sb.from(table).update({...patch, updated_at:new Date().toISOString()}).eq('id',id).select().single();
    // Bảng chưa có cột updated_at -> thử lại không kèm cột này (tương thích schema cũ)
    if(error && /updated_at/i.test(error.message||'')){
      ({data,error}=await sb.from(table).update(patch).eq('id',id).select().single());
    }
    if(error) throw error; return data;
  },
  async remove(table, id){ const {error}=await sb.from(table).delete().eq('id',id); if(error) throw error; },
  async count(table, eq){ let q=sb.from(table).select('*',{count:'exact',head:true}); if(eq) for(const k in eq) q=q.eq(k,eq[k]); const {count,error}=await q; if(error) throw error; return count; }
};

/* ---------- AUTH ---------- */
const Auth = {
  user:null,
  async init(){
    initSupabase();
    const {data:{session}} = await sb.auth.getSession();
    if(session){ await this.handleSession(session); }
    else { this.showLogin(); }
    // QUAN TRỌNG: không await/gọi API supabase bên trong callback này (gây deadlock -> treo).
    // Luôn đẩy sang tick sau bằng setTimeout.
    sb.auth.onAuthStateChange((evt, session)=>{
      if(evt==='SIGNED_OUT'){ setTimeout(()=>{ if(this._denied||this._manualOut) return; this.user=null; this.showLogin(); },0); }
      else if(session && (evt==='SIGNED_IN' || evt==='USER_UPDATED') && !this.user && !this._handling){
        setTimeout(()=>this.handleSession(session),0);
      }
    });
  },
  async handleSession(session){
    if(this._handling) return;
    this._handling = true;
    this._denied = false;
    try{
      const email = session.user.email;
      const allowed = await this.checkAllowed(email);
      if(!allowed){ await this.deny(email); return; }
      this.user = session.user;
      this.showTransition();
      setTimeout(()=>{ this.showApp(); }, 900);
    }finally{ this._handling = false; }
  },
  async checkAllowed(email){
    // 1) Frontend check
    if(!CONFIG.ALLOWED_EMAILS.includes(email)) return false;
    // 2) Backend allowlist table check (RLS-protected)
    try{
      const {data,error} = await sb.from('wed_allowed_users').select('email').eq('email',email).maybeSingle();
      if(error) { console.warn('Allowlist check error'); return false; }
      return !!data;
    }catch(e){ return false; }
  },
  async signInWithGoogle(){
    const btn=document.getElementById('btnGoogleLogin');
    const txt=document.getElementById('googleBtnText');
    const errEl=document.getElementById('loginError');
    const showError=(msg)=>{ errEl.textContent=msg; errEl.classList.add('show'); btn.disabled=false; txt.textContent='Tiếp tục với Google'; };
    btn.disabled=true; txt.textContent='Đang chuyển hướng...';
    errEl.classList.remove('show');
    // Phải mở qua http(s), không phải file://
    if(location.protocol==='file:'){
      showError('Bạn đang mở file trực tiếp trên máy. Google OAuth cần host qua http/https (GitHub Pages, Netlify...). Vui lòng upload file lên web rồi mở bằng URL https.');
      return;
    }
    if(!sb){ showError('Ứng dụng chưa khởi tạo được Supabase. Tải lại trang hoặc kiểm tra kết nối mạng.'); return; }
    const inIframe = (()=>{ try{ return window.top!==window.self; }catch(e){ return true; } })();
    // Redirect URL phải là chính trang này (đã khai báo trong Supabase → Redirect URLs)
    const pageUrl = window.location.origin + window.location.pathname;
    try{
      if(inIframe){
        // ---- POPUP FLOW: chạy được trong iframe vì Google mở ở cửa sổ top-level ----
        // Mở popup NGAY trong sự kiện click (đồng bộ) để không bị chặn popup
        const w=500,h=650, left=Math.max(0,(screen.width-w)/2), top=Math.max(0,(screen.height-h)/2);
        const popup = window.open('about:blank', POPUP_NAME, `width=${w},height=${h},left=${left},top=${top}`);
        if(!popup){ showError('Trình duyệt đã chặn cửa sổ đăng nhập. Hãy cho phép popup cho trang này rồi bấm lại, hoặc mở trang trong tab riêng.'); return; }
        try{ popup.document.write('<p style="font-family:sans-serif;padding:24px;color:#555">Đang mở Google…</p>'); }catch(e){}
        const {data,error} = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:pageUrl, scopes:'openid email profile', skipBrowserRedirect:true, queryParams:{ prompt:'select_account' } } });
        if(error || !data?.url){ popup.close(); throw error || new Error('Không lấy được URL đăng nhập'); }
        popup.location.href = data.url;
        Auth._waitPopup(popup, showError);
        return;
      }
      // ---- REDIRECT FLOW (tab riêng) ----
      const redirectTo = pageUrl;
      const {error} = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo, scopes:'openid email profile', queryParams:{ prompt:'select_account' } } });
      if(error) throw error;
      // signInWithOAuth tự chuyển hướng trình duyệt; nếu vẫn ở đây sau 1.5s thì có thể redirect URL chưa được thêm vào Supabase
      setTimeout(()=>{ if(document.visibilityState==='visible'){ showError('Không chuyển hướng được. Kiểm tra: 1) đã bật Google provider trong Supabase Auth, 2) đã thêm "'+redirectTo+'" vào Redirect URLs (Supabase → Authentication → URL Configuration).'); } }, 4000);
    }catch(e){
      const m=(e&&e.message)||'';
      let hint='Đăng nhập thất bại: '+m;
      if(/not enabled|provider/i.test(m)) hint='Google provider chưa bật trong Supabase. Vào Authentication → Providers → Google, bật lên và nhập Client ID/Secret từ Google Cloud Console.';
      else if(/redirect|url/i.test(m)) hint='URL chuyển hướng chưa được thêm. Vào Supabase → Authentication → URL Configuration → thêm: '+(window.location.origin+window.location.pathname.replace(/\/[^/]*$/,'/'));
      showError(hint);
    }
  },
  _waitPopup(popup, showError){
    const done=()=>{ window.removeEventListener('message', onMsg); clearInterval(timer); };
    const onMsg=async (e)=>{
      if(e.source!==popup || !e.data || e.data.type!=='wed-oauth') return;
      done();
      try{ popup.close(); }catch(_){}
      if(e.data.error){ showError('Đăng nhập thất bại: '+e.data.error); return; }
      try{
        const {error}=await sb.auth.setSession({ access_token:e.data.access_token, refresh_token:e.data.refresh_token });
        if(error) throw error;
        // onAuthStateChange(SIGNED_IN) sẽ tự gọi handleSession
      }catch(err){ showError('Không thiết lập được phiên đăng nhập: '+(err.message||err)); }
    };
    window.addEventListener('message', onMsg);
    const timer=setInterval(()=>{ if(popup.closed){ done(); const b=document.getElementById('btnGoogleLogin'); if(b && !Auth.user){ b.disabled=false; document.getElementById('googleBtnText').textContent='Tiếp tục với Google'; } } }, 600);
  },
  async deny(email){
    this._denied=true;
    await this._hardSignOut();
    this.user=null;
    const dm=document.querySelector('#denied .denied-msg');
    if(dm) dm.textContent='Tài khoản '+(email||'này')+' không nằm trong danh sách được phê duyệt. Hãy đăng nhập bằng tài khoản khác.';
    document.getElementById('login').style.display='none';
    document.getElementById('transition').classList.remove('show');
    document.getElementById('app').classList.remove('show');
    document.getElementById('denied').classList.add('show');
    Toast.err('Tài khoản '+(email||'này')+' không được phép truy cập');
  },
  async _hardSignOut(){
    // signOut local (không phụ thuộc mạng, có timeout) rồi xoá sạch token còn sót
    try{ await Promise.race([ sb.auth.signOut({scope:'local'}), new Promise(r=>setTimeout(r,2500)) ]); }catch(e){}
    try{
      [localStorage, sessionStorage].forEach(st=>{
        Object.keys(st).filter(k=>/^sb-|supabase/i.test(k)).forEach(k=>st.removeItem(k));
      });
    }catch(e){}
  },
  resetLoginUI(){
    const b=document.getElementById('btnGoogleLogin'), t=document.getElementById('googleBtnText'), e=document.getElementById('loginError');
    if(b) b.disabled=false; if(t) t.textContent='Tiếp tục với Google'; if(e) e.classList.remove('show');
  },
  showLogin(){
    this.resetLoginUI();
    try{ if(location.hash||location.search) history.replaceState(null,'',location.pathname); }catch(e){}
    document.getElementById('app').classList.remove('show');
    document.getElementById('transition').classList.remove('show');
    document.getElementById('denied').classList.remove('show');
    document.getElementById('login').style.display='flex';
  },
  showTransition(){
    document.getElementById('login').style.display='none';
    document.getElementById('denied').classList.remove('show');
    document.getElementById('transition').classList.add('show');
  },
  showApp(){
    document.getElementById('login').style.display='none';
    document.getElementById('transition').classList.remove('show');
    document.getElementById('app').classList.add('show');
    // user chip
    const u=this.user;
    document.getElementById('userName').textContent=u.user_metadata?.full_name || u.email.split('@')[0];
    document.getElementById('userEmail').textContent=u.email;
    document.getElementById('userAvatar').textContent=Util.initials(u.user_metadata?.full_name || u.email);
    Router.init();
    Toast.ok('Đăng nhập thành công — chào '+(u.user_metadata?.full_name || u.email.split('@')[0]));
  },
  async signOut(){
    const wasDenied=this._denied;
    this._manualOut=true;
    await this._hardSignOut();
    setTimeout(()=>{ this._manualOut=false; },300);
    this.user=null;
    this._handling=false;
    this._denied=false;
    this.showLogin();
    if(!wasDenied) Toast.ok('Đã đăng xuất');
  }
};

  current:'overview',
  navItems:[
    {id:'overview',label:'Tổng quan',ico:I.overview,group:'Chính'},

  ],
  init(){
    this.renderNav();
    const hash = location.hash.slice(2) || 'overview';
    this.go(hash);
    window.addEventListener('hashchange', ()=> this.go(location.hash.slice(2)||'overview'));
  },
  renderNav(){
    let lastGroup='';
    let navHTML='';
    let mobHTML='';
    const mobileSet = new Set(['overview','guest','seating','events','tasks','budget','settings']);
    this.navItems.forEach(it=>{
      if(it.group!==lastGroup){ navHTML+=`<div class="nav-section">${it.group}</div>`; lastGroup=it.group; }
      navHTML+=`<button class="nav-item" data-route="${it.id}" onclick="Router.go('${it.id}')">${it.ico.replace('<svg','<svg class="ico"')}<span>${it.label}</span><span class="badge" id="badge-${it.id}" style="display:none">0</span></button>`;
      if(mobileSet.has(it.id)) mobHTML+=`<button class="mn-item" data-route="${it.id}" onclick="Router.go('${it.id}')">${it.ico.replace('<svg','<svg class="ico"')}<span>${it.label}</span></button>`;
    });
    document.getElementById('nav').innerHTML=navHTML;
    document.getElementById('mobileNav').innerHTML=mobHTML;
  },
  go(route){
    if(route==='groups'||route==='rsvp'){ Guestbook.tab=route; route='guest'; }
    if(!this.routes[route]) route='overview';
    this.current=route;
    location.hash='#/'+route;
    document.querySelectorAll('.nav-item,.mn-item').forEach(el=>{
      el.classList.toggle('active', el.dataset.route===route);
    });
    const item=this.navItems.find(i=>i.id===route);
    document.getElementById('viewTitle').textContent=item.label;
    document.getElementById('topbarActions').innerHTML='';
    document.getElementById('content').innerHTML='';
    this.routes[route].render();
  }
};

   VIEW: OVERVIEW
   ============================================================ */
const Overview = {
  async render(){
    const c=document.getElementById('content');
    c.innerHTML=`<div class="loading-center"><div class="spin"></div>Đang tải dữ liệu...</div>`;
    try{
      const [settings, guests, events, tasks, tables, assignments] = await Promise.all([
        DB.list('wed_wedding_settings').catch(()=>[]),
        DB.list('wed_guests').catch(()=>[]),
        DB.list('wed_events',{order:['event_date']}).catch(()=>[]),
        DB.list('wed_tasks').catch(()=>[]),
        DB.list('wed_tables').catch(()=>[]),
        DB.list('wed_seating_assignments').catch(()=>[])
      ]);
      const s = settings[0]||{};
      const totalInvited = guests.reduce((a,g)=>a+(g.invited_count||1),0);
      const confirmed = guests.filter(g=>(g.rsvp_status||'')==='confirmed').reduce((a,g)=>a+(g.confirmed_count||0),0);
      const declined = guests.filter(g=>(g.rsvp_status||'')==='declined').length;
      const pending = guests.filter(g=>!g.rsvp_status||['not_sent','sent','pending'].includes(g.rsvp_status)).length;
      const groomCount = guests.filter(g=>g.side==='groom').length;
      const brideCount = guests.filter(g=>g.side==='bride').length;
      const totalCap = tables.reduce((a,t)=>a+(t.capacity||0),0);
      const seated = assignments.reduce((a,x)=>a+(x.seat_count||1),0);
      const overdueTasks = tasks.filter(t=>t.due_date && t.status!=='done' && Util.daysUntil(t.due_date)<0).length;
      const upcomingTasks = tasks.filter(t=>t.due_date && t.status!=='done' && Util.daysUntil(t.due_date)>=0 && Util.daysUntil(t.due_date)<=7).length;
      const days = Util.daysUntil(s.wedding_date);

      let html='<div class="stat-grid">';
      if(s.wedding_date){
        html+=`<div class="stat"><div class="accent-bar"></div><div class="stat-label">Ngày cưới</div><div class="stat-value">${days!==null&&days>=0?days:'—'}</div><div class="stat-sub">${days>=0?'ngày nữa · '+Util.esc(s.groom_name||'')+' & '+Util.esc(s.bride_name||''):Util.fmtDate(s.wedding_date)}</div></div>`;
      }
      html+=`<div class="stat"><div class="accent-bar"></div><div class="stat-label">Tổng khách mời</div><div class="stat-value">${guests.length}</div><div class="stat-sub">${totalInvited} người được mời</div></div>`;
      html+=`<div class="stat forest"><div class="accent-bar"></div><div class="stat-label">Đã xác nhận</div><div class="stat-value">${confirmed}</div><div class="stat-sub">sẽ tham dự</div></div>`;
      html+=`<div class="stat warn"><div class="accent-bar"></div><div class="stat-label">Chưa phản hồi</div><div class="stat-value">${pending}</div><div class="stat-sub">cần liên hệ</div></div>`;
      html+=`<div class="stat danger"><div class="accent-bar"></div><div class="stat-label">Từ chối</div><div class="stat-value">${declined}</div><div class="stat-sub">không tham dự</div></div>`;
      html+=`<div class="stat champagne"><div class="accent-bar"></div><div class="stat-label">Bàn tiệc</div><div class="stat-value">${seated}/${totalCap}</div><div class="stat-sub">${tables.length} bàn · ${totalCap-seated} chỗ trống</div></div>`;
      html+='</div>';

      // Two sides
      html+='<div class="col2 mb-24">';
      html+=this.sideCard('Nhà trai', groomCount, guests.filter(g=>g.side==='groom'), s.groom_side_label||'Nhà trai');
      html+=this.sideCard('Nhà gái', brideCount, guests.filter(g=>g.side==='bride'), s.bride_side_label||'Nhà gái');
      html+='</div>';

      // Alerts
      const alerts=[];
      if(pending>0) alerts.push({ico:'!',msg:`${pending} khách chưa phản hồi lời mời`,action:'rsvp'});
      if(overdueTasks>0) alerts.push({ico:'!',msg:`${overdueTasks} công việc đã quá hạn`,action:'tasks'});
      if(totalCap>0 && seated>totalCap) alerts.push({ico:'!',msg:'Số chỗ đã vượt sức chứa bàn tiệc',action:'seating'});
      if(totalCap>0 && confirmed>totalCap) alerts.push({ico:'!',msg:`Khách xác nhận (${confirmed}) nhiều hơn chỗ ngồi (${totalCap})`,action:'seating'});
      if(upcomingTasks>0) alerts.push({ico:'i',msg:`${upcomingTasks} công việc sắp đến hạn trong 7 ngày`,action:'tasks'});
      if(alerts.length){
        html+='<div class="section-h">Cần xử lý</div><div class="card" style="padding:8px 16px;margin-bottom:24px">';
        alerts.forEach(a=>{ html+=`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)"><span style="color:${a.ico==='!'?'var(--warn)':'var(--champagne)'};font-weight:700">${a.ico==='!'?'!':'i'}</span><span style="flex:1;font-size:13px">${a.msg}</span><button class="btn btn-ghost btn-sm" onclick="Router.go('${a.action}')">Xem</button></div>`; });
        html+='</div>';
      }

      // Upcoming events
      if(events.length){
        html+='<div class="section-h">Sự kiện sắp tới</div>';
        events.slice(0,3).forEach(e=>{
          const evGuests = guests.filter(g=>g.event_ids&&g.event_ids.includes(e.id)).length;
          html+=`<div class="event-card"><div class="event-name">${Util.esc(e.name)}</div><div class="event-meta"><span>${Util.fmtDateLong(e.event_date)}</span>${e.event_time?`<span>· ${e.event_time}</span>`:''}${e.venue?`<span>· ${Util.esc(e.venue)}</span>`:''}</div></div>`;
        });
      }
      c.innerHTML=html;
    }catch(e){
      c.innerHTML=`<div class="empty"><div class="empty-title">Không tải được dữ liệu</div><div class="empty-msg">${Util.esc(e.message||'Lỗi kết nối')}</div><button class="btn btn-ghost" onclick="Overview.render()">Thử lại</button></div>`;
    }
  },
  sideCard(label, count, guests, fullLabel){
    const confirmed = guests.filter(g=>(g.rsvp_status||'')==='confirmed').length;
    const pct = count?Math.round(confirmed/count*100):0;
    return `<div class="card" style="padding:22px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div><div style="font-family:var(--serif);font-size:20px;font-weight:600">${Util.esc(fullLabel)}</div><div class="muted text-sm">${count} khách</div></div>
        <div style="text-align:right"><div style="font-family:var(--serif);font-size:28px;font-weight:600">${confirmed}</div><div class="muted text-xs">đã xác nhận</div></div>
      </div>
      <div class="progress"><div class="progress-bar ${label==='Nhà gái'?'':''}" style="width:${pct}%"></div></div>
      <div class="text-xs muted" style="margin-top:6px">${pct}% phản hồi</div>
    </div>`;
  }
};

  stats(list){

    return { guests:list.length, invited:list.reduce((s,g)=>s+(Number(g.invited_count)||1),0), confirmed:ok.reduce((s,g)=>s+(Number(g.confirmed_count)||Number(g.invited_count)||1),0), replied:list.filter(g=>['confirmed','declined'].includes(g.rsvp_status)).length, gift:list.reduce((s,g)=>s+(Number(g.gift_amount)||0),0) };
  },
  tableOf(id){ const a=this.assigns.find(x=>x.guest_id===id); const t=a&&this.tables.find(x=>x.id===a.table_id); return t?t:null; },
  paint(){
    const tabs=[['list','Danh sách khách'],['groups','Nhóm & gia đình'],['rsvp','Thiệp & xác nhận']];
    const sideCard=(s)=>{ const l=this.guests.filter(g=>g.side===s), x=this.stats(l), pct=x.guests?Math.round(x.replied/x.guests*100):0;
      return `<div class="gx-side gx-${s}"><div class="gx-side-top"><div><div class="gx-side-name">${Util.esc(this.sideLabel(s))}</div><div class="gx-side-sub">${x.guests} khách · ${x.invited} người được mời</div></div><div class="gx-side-big">${x.confirmed}<small>sẽ tham dự</small></div></div>
      <div class="gx-bar"><i style="width:${pct}%"></i></div><div class="gx-side-foot"><span>${pct}% đã phản hồi</span><span>Tiền mừng: <b>${Util.fmtMoney(x.gift)}</b></span></div></div>`; };
    const bar=`<div class="gx-sides">${sideCard('groom')}${sideCard('bride')}</div><div class="gx-tabs">${tabs.map(t=>`<button class="gx-tab ${this.tab===t[0]?'on':''}" onclick="Guestbook.setTab('${t[0]}')">${t[1]}</button>`).join('')}</div>`;
    document.getElementById('content').innerHTML=bar+`<div id="gxBody"></div>`;
    this.paintBody();
  },
  setTab(t){ this.tab=t; this.paint(); },
  paintBody(){ if(this.tab==='groups') this.paintGroups(); else if(this.tab==='rsvp') this.paintRsvp(); else this.paintList(); },
  /* ---------- TAB 1: DANH SÁCH ---------- */
  paintList(){
    const gOpts=this.groups.map(x=>`<option value="${x.id}" ${this.filterGroup===x.id?'selected':''}>${Util.esc(x.name)} (${this.sideLabel(x.side)})</option>`).join('');
    const sel=(v,c)=>v===c?'selected':'';
    document.getElementById('gxBody').innerHTML=`<div class="toolbar"><div class="search-box">${I.search.replace('<svg','<svg class="ico"')}<input id="gSearch" placeholder="Tìm theo tên, SĐT, người mời..." value="${Util.esc(this.search)}"/></div>
      <select class="filter-select" id="ffSide"><option value="">Tất cả bên</option><option value="groom" ${sel(this.filterSide,'groom')}>${Util.esc(this.sideLabel('groom'))}</option><option value="bride" ${sel(this.filterSide,'bride')}>${Util.esc(this.sideLabel('bride'))}</option></select>
      <select class="filter-select" id="ffGroup"><option value="">Tất cả nhóm</option>${gOpts}</select>
      <select class="filter-select" id="ffRsvp"><option value="">Tất cả RSVP</option>${Object.keys(RS_MAP).map(k=>`<option value="${k}" ${sel(this.filterRsvp,k)}>${RS_MAP[k][0]}</option>`).join('')}</select></div><div id="guestList"></div>`;
    document.getElementById('gSearch').addEventListener('input',Util.debounce(e=>{this.search=e.target.value.toLowerCase();this.renderRows();},250));
    document.getElementById('ffSide').onchange=e=>{this.filterSide=e.target.value;this.renderRows();};
    document.getElementById('ffGroup').onchange=e=>{this.filterGroup=e.target.value;this.renderRows();};
    document.getElementById('ffRsvp').onchange=e=>{this.filterRsvp=e.target.value;this.renderRows();};
    this.renderRows();
  },
  renderRows(){
    let l=this.guests; const q=this.search;
    if(q) l=l.filter(g=>[g.full_name,g.display_name,g.phone,g.inviter_name].some(v=>(v||'').toLowerCase().includes(q)));
    if(this.filterSide) l=l.filter(g=>g.side===this.filterSide);
    if(this.filterGroup) l=l.filter(g=>g.group_id===this.filterGroup);
    if(this.filterRsvp) l=l.filter(g=>(g.rsvp_status||'not_sent')===this.filterRsvp);
    const el=document.getElementById('guestList');
    if(!l.length){ el.innerHTML=UI.empty(I.guest,'Không có khách phù hợp','Thêm khách mới hoặc nhập từ CSV.',`<button class="btn btn-primary" onclick="Guestbook.openAdd()">Thêm khách</button>`); return; }
    const gm={}; this.groups.forEach(x=>gm[x.id]=x.name);
    const ic=i=>i.replace('<svg','<svg style="width:15px;height:15px"');
    const rows=l.map(g=>{ const r=RS_MAP[g.rsvp_status||'not_sent']||RS_MAP.not_sent, t=this.tableOf(g.id), amt=Number(g.gift_amount)||0;
      return `<tr ondblclick="Guestbook.openEdit('${g.id}')">
      <td><div class="gx-name"><span class="gx-av gx-av-${g.side}">${Util.initials(g.full_name)}</span><div><div style="font-weight:600;color:var(--ink)">${Util.esc(g.full_name)}</div><div class="text-xs muted">${Util.esc(g.display_name||g.relationship||'')}</div></div></div></td>
      <td><span class="pill ${g.side==='groom'?'pill-side-groom':'pill-side-bride'}">${Util.esc(this.sideLabel(g.side))}</span></td>
      <td>${g.group_id?Util.esc(gm[g.group_id]||'—'):'<span class="muted">—</span>'}</td>
      <td>${g.phone?Util.esc(g.phone):'<span class="muted">—</span>'}</td>
      <td>${g.inviter_name?Util.esc(g.inviter_name):'<span class="muted">—</span>'}</td>
      <td>${t?`<span class="gx-tbl">${Util.esc(t.name)}</span>`:'<span class="muted">—</span>'}</td>
      <td style="white-space:nowrap">${amt?`<b style="color:var(--ink)">${Util.fmtMoney(amt)}</b> <span class="pill ${g.gift_method==='transfer'?'pill-sent':'pill-confirmed'}">${PAY_MAP[g.gift_method]||'Tiền mặt'}</span>`:'<span class="muted">—</span>'}</td>
      <td><span class="pill ${r[1]}">${r[0]}</span>${g.confirmed_count?` <span class="text-xs muted">(${g.confirmed_count})</span>`:''}</td>
      <td class="right" style="white-space:nowrap"><button class="btn-close" onclick="Guestbook.openEdit('${g.id}')" title="Sửa">${ic(I.edit)}</button><button class="btn-close" onclick="Guestbook.confirmDelete('${g.id}')" title="Xóa">${ic(I.trash)}</button></td></tr>`; }).join('');
    const x=this.stats(l);
    el.innerHTML=`<div class="tbl-wrap"><div class="tbl-scroll"><table class="tbl"><thead><tr><th>Khách mời</th><th>Bên</th><th>Nhóm</th><th>Điện thoại</th><th>Người mời</th><th>Bàn</th><th>Tiền mừng</th><th>RSVP</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="text-xs muted" style="margin-top:10px">${l.length}/${this.guests.length} khách · ${x.invited} người được mời · ${x.confirmed} xác nhận · Tiền mừng ${Util.fmtMoney(x.gift)}</div>`;
  },
  /* ---------- TAB 2: NHÓM & GIA ĐÌNH ---------- */
  paintGroups(){
    const col=s=>{
      const gl=this.groups.filter(g=>g.side===s), all=this.guests.filter(g=>g.side===s), x=this.stats(all);
      const ungrouped=all.filter(g=>!g.group_id||!gl.some(q=>q.id===g.group_id));
      const card=(gr,members)=>{ const k=gr?gr.id:'none'+s, st=this.stats(members), o=this.open.has(k), pct=st.guests?Math.round(st.replied/st.guests*100):0;
        const mem=members.map(m=>{ const r=RS_MAP[m.rsvp_status||'not_sent']; const t=this.tableOf(m.id);
          return `<div class="gx-mem" onclick="Guestbook.openEdit('${m.id}')"><span class="gx-av gx-av-${m.side}">${Util.initials(m.full_name)}</span><div style="flex:1;min-width:0"><div class="gx-mem-n">${Util.esc(m.full_name)}${gr&&m.side!==gr.side?' <span class="pill pill-pending">lệch bên</span>':''}</div><div class="text-xs muted">${Util.esc(m.relationship||'')}${t?(m.relationship?' · ':'')+Util.esc(t.name):''}</div></div><span class="pill ${r[1]}">${r[0]}</span></div>`; }).join('');
        return `<div class="gx-grp"><div class="gx-grp-h" onclick="Guestbook.toggle('${k}')"><div style="flex:1;min-width:0"><div class="gx-grp-n">${Util.esc(gr?gr.name:'Chưa phân nhóm')}${gr&&gr.category?` <span class="gx-cat">${CAT_MAP[gr.category]||gr.category}</span>`:''}</div>
          <div class="text-xs muted">${st.guests} khách · ${st.invited} người mời · ${st.confirmed} xác nhận</div><div class="gx-bar sm"><i style="width:${pct}%"></i></div></div>
          ${gr?`<button class="btn-close" title="Sửa" onclick="event.stopPropagation();Guestbook.openGroup('${gr.id}')">${I.edit.replace('<svg','<svg style="width:15px;height:15px"')}</button><button class="btn-close" title="Xóa" onclick="event.stopPropagation();Guestbook.confirmDeleteGroup('${gr.id}')">${I.trash.replace('<svg','<svg style="width:15px;height:15px"')}</button>`:''}
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" style="width:18px;height:18px;color:var(--muted);transition:transform .2s;${o?'transform:rotate(180deg)':''}"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="gx-mems" style="display:${o?'block':'none'}">${mem||'<div class="text-xs muted" style="padding:12px 0">Chưa có thành viên. Chọn nhóm này khi thêm/sửa khách.</div>'}</div></div>`; };
      return `<div class="gx-col gx-${s}"><div class="gx-col-h"><div><div class="gx-col-t">${Util.esc(this.sideLabel(s))}</div><div class="gx-col-s">${gl.length} nhóm · ${x.guests} khách · ${x.invited} người mời · ${x.confirmed} xác nhận</div></div><button class="gx-add" onclick="Guestbook.openGroup(null,'${s}')">+ Nhóm</button></div>
        ${gl.map(g=>card(g,this.guests.filter(m=>m.group_id===g.id))).join('')}${ungrouped.length?card(null,ungrouped):''}${!gl.length&&!ungrouped.length?'<div class="empty-msg" style="padding:24px;text-align:center">Chưa có nhóm nào</div>':''}</div>`; };
    document.getElementById('gxBody').innerHTML=`<div class="gx-cols">${col('groom')}${col('bride')}</div>`;
  },
  toggle(k){ this.open.has(k)?this.open.delete(k):this.open.add(k); this.paintGroups(); },
  openGroup(id,side){
    const g=id?this.groups.find(x=>x.id===id):null; const sd=g?g.side:(side||'groom');
    const body=`<div class="field"><label class="label">Tên nhóm *</label><input class="input" id="grName" value="${g?Util.esc(g.name):''}" placeholder="Bạn đại học, Gia đình chú Ba..."/></div>
    <div class="row"><div class="field"><label class="label">Bên gia đình *</label><select class="select" id="grSide"><option value="groom" ${sd==='groom'?'selected':''}>${Util.esc(this.sideLabel('groom'))}</option><option value="bride" ${sd==='bride'?'selected':''}>${Util.esc(this.sideLabel('bride'))}</option></select></div>
    <div class="field"><label class="label">Phân loại</label><select class="select" id="grCat"><option value="">—</option>${Object.keys(CAT_MAP).map(k=>`<option value="${k}" ${g&&g.category===k?'selected':''}>${CAT_MAP[k]}</option>`).join('')}</select></div></div>`;
    UI.openDrawer(g?'Sửa nhóm':'Thêm nhóm',body,`<button class="btn btn-ghost" onclick="UI.closeDrawer()">Hủy</button><button class="btn btn-primary" onclick="Guestbook.saveGroup('${g?g.id:''}')">${g?'Lưu':'Thêm nhóm'}</button>`);

  async saveGroup(id){
    const row={name:document.getElementById('grName').value.trim(),side:document.getElementById('grSide').value,category:document.getElementById('grCat').value||null};
    if(!row.name){Toast.err('Nhập tên nhóm');return;}
    if(this.groups.some(g=>g.id!==id&&g.side===row.side&&norm(g.name)===norm(row.name))){Toast.err('Nhóm này đã tồn tại ở '+this.sideLabel(row.side));return;}
    try{ if(id) await DB.update('wed_guest_groups',id,row); else await DB.insert('wed_guest_groups',row); Toast.ok('Đã lưu nhóm'); UI.closeDrawer(); await this.load(); }catch(e){Toast.err('Lưu thất bại: '+(e.message||''));}
  },
  confirmDeleteGroup(id){ const gr=this.groups.find(x=>x.id===id), n=this.guests.filter(g=>g.group_id===id).length;
    UI.confirm('Xóa nhóm?',`Xóa <b>${Util.esc(gr.name)}</b>?${n?`<br><br>${n} khách sẽ được gỡ khỏi nhóm (không bị xóa).`:''}`,async()=>{ try{ if(n) await sb.from('wed_guests').update({group_id:null}).eq('group_id',id); await DB.remove('wed_guest_groups',id); Toast.ok('Đã xóa nhóm'); await this.load(); }catch(e){Toast.err('Xóa thất bại: '+(e.message||''));} },'Xóa',true); },
  /* ---------- TAB 3: THIỆP & XÁC NHẬN ---------- */
  paintRsvp(){
    let h='<div class="gx-kan">';
    Object.keys(RS_MAP).forEach(k=>{ const items=this.guests.filter(g=>(g.rsvp_status||'not_sent')===k), ppl=items.reduce((s,g)=>s+(k==='confirmed'?(Number(g.confirmed_count)||Number(g.invited_count)||1):(Number(g.invited_count)||1)),0);
      h+=`<div class="gx-kcol"><div class="gx-kh"><span class="pill ${RS_MAP[k][1]}">${RS_MAP[k][0]}</span><span class="text-xs muted">${items.length} khách · ${ppl} người</span></div>`;

      items.forEach(g=>{ h+=`<div class="gx-kcard gx-${g.side}" onclick="Guestbook.openRsvp('${g.id}')"><div style="font-size:13px;font-weight:600">${Util.esc(g.full_name)}</div><div class="text-xs muted">${Util.esc(this.sideLabel(g.side))}${g.phone?' · '+Util.esc(g.phone):''}${g.confirmed_count?` · ${g.confirmed_count} người`:''}</div></div>`; });

        <div class="field"><label class="label">Số bàn</label><select class="select" id="gTable"><option value="">— Chưa xếp bàn —</option>${tblOpts}</select>${this.tables.length?'':'<div class="text-xs muted" style="margin-top:4px">Chưa có bàn. Tạo ở mục Sơ đồ bàn tiệc.</div>'}</div></div>
        <div class="row"><div class="field" style="margin-bottom:0"><label class="label">Số tiền mừng</label><div class="gx-money"><input class="input" id="gAmount" inputmode="numeric" placeholder="0" value="${g&&g.gift_amount?Number(g.gift_amount).toLocaleString('vi-VN'):''}" oninput="Guestbook.fmtMoney(this)"/><span>₫</span></div></div>
        <div class="field" style="margin-bottom:0"><label class="label">Hình thức</label><select class="select" id="gMethod"><option value="cash" ${!g||g.gift_method!=='transfer'?'selected':''}>Tiền mặt</option><option value="transfer" ${g&&g.gift_method==='transfer'?'selected':''}>Chuyển khoản</option></select></div></div>
      </div>
      <div class="gx-sec">Khác</div>
      <div class="field"><label class="label">Nhu cầu ăn uống / hỗ trợ đặc biệt</label><input class="input" id="gDiet" value="${v('dietary')}" placeholder="Ăn chay, dị ứng..."/></div>
      <div class="field"><label class="label">Sự kiện được mời</label>${ev}</div>
      <div class="field"><label class="label">Ghi chú nội bộ</label><textarea class="textarea" id="gNotes" placeholder="Ghi chú riêng">${v('notes')}</textarea></div>`;
    UI.openDrawer(g?'Sửa khách mời':'Thêm khách mời',body,`<button class="btn btn-ghost" onclick="UI.closeDrawer()">Hủy</button><button class="btn btn-primary" id="btnSaveGuest" onclick="Guestbook.save('${g?g.id:''}')">${g?'Lưu thay đổi':'Thêm khách'}</button>`);
    document.querySelectorAll('#gSideSeg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#gSideSeg button').forEach(x=>x.classList.toggle('on',x===b));});
  },
  fmtMoney(el){ const d=el.value.replace(/\D/g,''); el.value=d?Number(d).toLocaleString('vi-VN'):''; },
  async save(id){
    const btn=document.getElementById('btnSaveGuest'), lbl=id?'Lưu thay đổi':'Thêm khách';
    const $=i=>document.getElementById(i).value;
    const row={full_name:$('gName').trim(),display_name:$('gDisplay').trim()||null,side:document.querySelector('#gSideSeg .on').dataset.v,group_id:$('gGroup')||null,relationship:$('gRel').trim()||null,phone:$('gPhone').trim()||null,email:$('gEmail').trim()||null,is_representative:$('gRep')==='true',invited_count:parseInt($('gInvited'))||1,confirmed_count:parseInt($('gConfirmed'))||0,rsvp_status:$('gRsvp'),inviter_name:$('gInviter').trim()||null,gift_amount:parseInt($('gAmount').replace(/\D/g,''))||0,gift_method:$('gMethod')||'cash',dietary:$('gDiet').trim()||null,event_ids:Array.from(document.querySelectorAll('.ev-chk:checked')).map(c=>c.value),notes:$('gNotes').trim()||null};
    if(!row.full_name){Toast.err('Vui lòng nhập họ tên');return;}
    const grp=this.groups.find(x=>x.id===row.group_id); if(grp&&grp.side!==row.side) Toast.warn('Nhóm đã chọn thuộc bên '+this.sideLabel(grp.side));
    const tid=$('gTable')||null;
    btn.disabled=true; btn.textContent='Đang lưu...';
    try{
      const saved=id?await DB.update('wed_guests',id,row):await DB.insert('wed_guests',row);
      await this.syncTable(saved.id,tid);
      Toast.ok(id?'Đã lưu thay đổi':'Đã thêm khách'); UI.closeDrawer(); await this.load();
    }catch(e){ const m=e.message||''; Toast.err(/inviter_name|gift_amount|gift_method/.test(m)?'Thiếu cột mới trong database — hãy chạy file SQL cập nhật':'Lưu thất bại: '+m); btn.disabled=false; btn.textContent=lbl; }
  },
  async syncTable(gid,tid){
    const ex=this.assigns.filter(a=>a.guest_id===gid);
    if(ex.length===1&&ex[0].table_id===tid) return;
    if(!ex.length&&!tid) return;
    for(const a of ex) await DB.remove('wed_seating_assignments',a.id);
    if(tid) await DB.insert('wed_seating_assignments',{guest_id:gid,table_id:tid,seat_count:1});
  },
  confirmDelete(id){
    const g=this.guests.find(x=>x.id===id);
    UI.confirm('Xóa khách mời?',`Bạn có chắc muốn xóa <b>${Util.esc(g.full_name)}</b>?${g.rsvp_status&&g.rsvp_status!=='not_sent'?'<br><br>Khách này đã có phản hồi RSVP — không thể hoàn tác.':''}`,async()=>{ try{await DB.remove('wed_guests',id);Toast.ok('Đã xóa khách');await this.load();}catch(e){Toast.err('Xóa thất bại: '+(e.message||''));} },'Xóa',true);
  },
  /* ---------- CSV: hiển thị tên trường tiếng Việt ---------- */
  exportCSV(){
    const gm={}; this.groups.forEach(g=>gm[g.id]=g.name);
    const cell={full_name:g=>g.full_name,display_name:g=>g.display_name,side:g=>this.sideLabel(g.side),group:g=>gm[g.group_id]||'',relationship:g=>g.relationship,phone:g=>g.phone,email:g=>g.email,is_representative:g=>g.is_representative?'Có':'Không',invited_count:g=>g.invited_count,confirmed_count:g=>g.confirmed_count,rsvp_status:g=>(RS_MAP[g.rsvp_status||'not_sent']||[''])[0],inviter_name:g=>g.inviter_name,table:g=>{const t=this.tableOf(g.id);return t?t.name:'';},gift_amount:g=>g.gift_amount||'',gift_method:g=>g.gift_amount?(PAY_MAP[g.gift_method]||'Tiền mặt'):'',dietary:g=>g.dietary,notes:g=>g.notes};
    let csv='\uFEFF'+G_FIELDS.map(f=>Util.csvEscape(f.label)).join(',')+'\n';
    this.guests.forEach(g=>{ csv+=G_FIELDS.map(f=>Util.csvEscape(cell[f.key](g))).join(',')+'\n'; });
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='khach-moi.csv'; a.click(); Toast.ok('Đã xuất CSV');
  },
  parseRow(r,idx){
    const get=k=>idx[k]>=0?(r[idx[k]]||'').trim():'';
    let sd=norm(get('side')); const side=/gai|bride/.test(sd)?'bride':'groom';
    const rs=norm(get('rsvp_status')); let rsvp='not_sent'; Object.keys(RS_MAP).forEach(k=>{ if(rs===norm(RS_MAP[k][0])||rs===norm(k)) rsvp=k; });
    const gm=norm(get('gift_method')); const method=/chuyen|ck|transfer|bank/.test(gm)?'transfer':'cash';
    return {full_name:get('full_name'),display_name:get('display_name')||null,side,groupName:get('group'),relationship:get('relationship')||null,phone:get('phone')||null,email:get('email')||null,is_representative:['co','1','true','yes','dai dien ho'].includes(norm(get('is_representative'))),invited_count:parseInt(get('invited_count'))||1,confirmed_count:parseInt(get('confirmed_count'))||0,rsvp_status:rsvp,inviter_name:get('inviter_name')||null,tableName:get('table'),gift_amount:parseInt(get('gift_amount').replace(/\D/g,''))||0,gift_method:method,dietary:get('dietary')||null,notes:get('notes')||null};
  },
  importCSV(){
    const input=document.createElement('input'); input.type='file'; input.accept='.csv,text/csv';
    input.onchange=async e=>{
      const file=e.target.files[0]; if(!file) return;
      try{
        const rows=Util.parseCSV(await file.text());
        if(rows.length<2){Toast.err('File CSV trống hoặc không đúng định dạng');return;}
        const heads=rows[0].map(norm), idx={};
        G_FIELDS.forEach(f=>{ const names=[norm(f.label),norm(f.key),...f.alias.map(norm)]; idx[f.key]=heads.findIndex(h=>names.includes(h)); });
        if(idx.full_name<0){Toast.err('Thiếu cột "Họ tên" trong file CSV');return;}
        const list=rows.slice(1).map(r=>this.parseRow(r,idx)).filter(x=>x.full_name);
        const prev=`<div class="text-sm muted mb-16">Tìm thấy <b>${list.length}</b> khách. Cột nhận diện: ${G_FIELDS.filter(f=>idx[f.key]>=0).map(f=>`<span class="gx-cat">${f.label}</span>`).join(' ')}</div>
        <div class="tbl-wrap" style="max-height:320px;overflow:auto"><table class="tbl"><thead><tr><th>#</th><th>Họ tên</th><th>Bên</th><th>Nhóm</th><th>Người mời</th><th>Bàn</th><th>Số tiền</th><th>Hình thức</th><th>Trùng?</th></tr></thead><tbody>${list.slice(0,50).map((x,i)=>{const dup=this.guests.some(g=>norm(g.full_name)===norm(x.full_name)&&g.side===x.side);return `<tr><td>${i+1}</td><td>${Util.esc(x.full_name)}</td><td>${Util.esc(this.sideLabel(x.side))}</td><td>${Util.esc(x.groupName||'—')}</td><td>${Util.esc(x.inviter_name||'—')}</td><td>${Util.esc(x.tableName||'—')}</td><td>${x.gift_amount?Util.fmtMoney(x.gift_amount):'—'}</td><td>${x.gift_amount?PAY_MAP[x.gift_method]:'—'}</td><td>${dup?'<span class="pill pill-pending">Trùng</span>':'—'}</td></tr>`;}).join('')}</tbody></table></div>${list.length>50?`<div class="text-xs muted mt-16">... và ${list.length-50} dòng nữa</div>`:''}`;
        UI.confirm('Nhập '+list.length+' khách?',prev,()=>this.doImport(list),'Nhập tất cả');
      }catch(err){Toast.err('Đọc file thất bại: '+(err.message||''));}
    };
    input.click();
  },
  async doImport(list){
    try{
      const newG=[]; list.forEach(x=>{ if(x.groupName&&!this.groups.some(g=>g.side===x.side&&norm(g.name)===norm(x.groupName))&&!newG.some(g=>g.side===x.side&&norm(g.name)===norm(x.groupName))) newG.push({name:x.groupName,side:x.side}); });
      if(newG.length){ const {error}=await sb.from('wed_guest_groups').insert(newG); if(error) throw error; this.groups=await DB.list('wed_guest_groups',{order:['name']}); }
      const rows=list.map(x=>{ const gr=this.groups.find(g=>g.side===x.side&&norm(g.name)===norm(x.groupName)); const {groupName,tableName,...r}=x; r.group_id=gr?gr.id:null; return r; });
      const {data,error}=await sb.from('wed_guests').insert(rows).select('id');
      if(error) throw error;
      const asg=[]; (data||[]).forEach((d,i)=>{ const t=this.tables.find(t=>norm(t.name)===norm(list[i].tableName)||(list[i].tableName&&norm(t.name)===norm('Bàn '+list[i].tableName))); if(t) asg.push({guest_id:d.id,table_id:t.id,seat_count:1}); });
      if(asg.length) await sb.from('wed_seating_assignments').insert(asg);
      Toast.ok(`Đã nhập ${(data||[]).length} khách${newG.length?`, tạo ${newG.length} nhóm mới`:''}`); await this.load();
    }catch(e){ const m=e.message||''; Toast.err(/inviter_name|gift_amount|gift_method/.test(m)?'Thiếu cột mới trong database — hãy chạy file SQL cập nhật':'Nhập thất bại: '+m); }
  }
};
